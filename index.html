<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SyncStream | Watch Party</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #landing-page { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
        .landing-card { background:var(--card); padding:30px; border-radius:12px; border:1px solid #334155; width:350px; display:flex; flex-direction:column; gap:15px; }
        #sidebar { width: 280px; background: var(--card); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        #main { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .video-box { width: 95%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border-radius: 12px; position: relative; overflow: hidden; border: 2px solid #334155; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .controls { width: 95%; max-width: 1000px; display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 12px; border-radius: 6px; background: #0f172a; color: white; border: 1px solid #334155; }
        button { border: none; border-radius: 6px; cursor: pointer; font-weight: bold; padding: 12px 20px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .user-card { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #334155; }
        .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .role-host { background: #fbbf24; color: #000; }
        .role-mod { background: #a855f7; color: #fff; }
    </style>
</head>
<body>
    <div id="landing-page">
        <h1 style="color: var(--accent);">SyncStream</h1>
        <div class="landing-card">
            <input type="text" id="user-name" placeholder="Enter your name">
            <button onclick="createNewRoom()" style="background:var(--accent); color:#0f172a;">Create New Room</button>
            <input type="text" id="room-input" placeholder="Enter Room ID">
            <button onclick="joinExistingRoom()" style="background:#334155; color:white;">Join Room</button>
        </div>
    </div>
    <div id="sidebar">
        <h2 style="color: var(--accent);">SyncStream</h2>
        <p id="room-display" style="font-size: 12px; color: #64748b;">Room: None</p>
        <hr style="border: 0.5px solid #334155; width: 100%;">
        <h4>Participants</h4>
        <div id="user-list"></div>
    </div>
    <div id="main">
        <div class="video-box"><div id="player"></div></div>
        <div class="controls">
            <input type="text" id="video-url" placeholder="Paste YouTube URL...">
            <button id="change-video-btn" style="background:var(--accent); color:#0f172a;">Sync Video</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
