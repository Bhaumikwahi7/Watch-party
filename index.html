<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncStream | Studio Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --surface: rgba(15, 23, 42, 0.85);
            --accent: #38bdf8;
            --glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% -20%, #1e1b4b, #020617);
            color: var(--text-main);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }

        #toast {
            position: fixed; top: 30px; right: 30px;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            border: 1px solid #ef4444; color: #fca5a5;
            padding: 16px 28px; border-radius: 16px; font-weight: 600;
            opacity: 0; transform: translateY(-20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        #landing-page {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }

        .landing-card {
            background: var(--surface); backdrop-filter: blur(24px);
            padding: 60px; border-radius: 40px; border: 1px solid var(--border);
            width: 440px; text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        #sidebar {
            width: 320px; background: var(--surface); backdrop-filter: blur(16px);
            padding: 40px 20px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 20px;
        }

        #main-content {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px;
        }

        .video-wrapper {
            width: 100%; max-width: 1100px; aspect-ratio: 16/9; background: #000;
            border-radius: 32px; overflow: hidden; border: 1px solid var(--border);
            box-shadow: 0 40px 80px rgba(0,0,0,0.9), 0 0 20px var(--glow);
            position: relative;
        }

        #player { position: absolute; inset: 0; width: 100%; height: 100%; }

        .control-bar {
            width: 100%; max-width: 1100px; margin-top: 30px;
            display: flex; gap: 12px; padding: 12px;
            background: rgba(255,255,255,0.03); border-radius: 24px; border: 1px solid var(--border);
        }

        input {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: white; padding: 12px 18px; border-radius: 14px; flex: 1; outline: none;
        }

        .btn-primary {
            background: var(--accent); color: #020617; border: none;
            padding: 12px 24px; border-radius: 14px; font-weight: 800;
            cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px var(--glow); }

        /* Chat Styles */
        #chat-container {
            flex: 1; display: flex; flex-direction: column;
            background: rgba(0,0,0,0.2); border-radius: 20px;
            border: 1px solid var(--border); overflow: hidden;
        }
        #chat-messages {
            flex: 1; overflow-y: auto; padding: 15px; font-size: 13px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .msg { padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.05); }
        .msg b { color: var(--accent); }
        
        .user-pill {
            background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 15px;
            border: 1px solid var(--border); margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
        }

        .badge { font-size: 9px; padding: 3px 8px; border-radius: 20px; font-weight: 900; }
        .badge-host { background: #fbbf24; color: #000; }
        .badge-mod { background: #a855f7; color: #fff; }
    </style>
</head>
<body>

    <div id="toast">Permission Denied</div>

    <div id="landing-page">
        <div class="landing-card">
            <h1 style="font-size: 2.5rem; margin: 0; color: var(--accent);">SyncStream</h1>
            <p style="color: var(--text-dim); margin-bottom: 40px; letter-spacing: 2px;">STUDIO EDITION</p>
            <input type="text" id="user-name" placeholder="Name" style="width: 85%; margin-bottom: 15px;">
            <button onclick="createNewRoom()" class="btn-primary" style="width: 95%; margin-bottom: 15px;">Create Party</button>
            <input type="text" id="room-input" placeholder="Room ID" style="width: 85%; margin-bottom: 15px;">
            <button onclick="joinExistingRoom()" class="btn-primary" style="width: 95%; background: transparent; border: 1px solid var(--border); color: white;">Join Room</button>
        </div>
    </div>

    <div id="sidebar">
        <div>
            <h2 style="color: var(--accent); margin: 0;">STUDIO</h2>
            <div id="room-display" style="color: var(--text-dim); font-size: 12px;">ID: --</div>
        </div>
        
        <div style="max-height: 150px; overflow-y: auto;">
            <h4 style="font-size: 11px; color: var(--text-dim); margin-bottom: 10px;">MEMBERS</h4>
            <div id="user-list"></div>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div style="padding: 10px; display: flex; gap: 5px; border-top: 1px solid var(--border);">
                <input type="text" id="chat-input" placeholder="Type..." style="padding: 8px;">
                <button onclick="sendChat()" style="background:var(--accent); border:none; border-radius:10px; padding: 0 15px; cursor:pointer;">➔</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div class="video-wrapper"><div id="player"></div></div>
        <div class="control-bar">
            <input type="text" id="video-url" placeholder="Paste YouTube link...">
            <button id="change-video-btn" class="btn-primary">Sync Video</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
